<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">TempoDance AI submission cover</title>
  <desc id="description">A dark editorial cover with an adaptive neon dancer and the words TempoDance AI, the coach that learns how you learn.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070a"/>
      <stop offset="0.52" stop-color="#111019"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7ff5f"/>
      <stop offset="0.48" stop-color="#75f4c4"/>
      <stop offset="1" stop-color="#8674ff"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f7ef"/>
      <stop offset="0.65" stop-color="#f6f7ef"/>
      <stop offset="1" stop-color="#b7aaff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#82f5c8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#82f5c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="30" fill="url(#background)"/>
  <rect width="1600" height="900" rx="30" fill="url(#grid)"/>
  <circle cx="1240" cy="410" r="470" fill="url(#glow)"/>
  <path d="M1100-80C978 116 1194 225 1108 404S974 734 1271 987" fill="none" stroke="#8d73ff" stroke-opacity=".12" stroke-width="150" filter="url(#blur)"/>

  <g transform="translate(92 82)">
    <g transform="translate(3 3)" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 25c31-8 49-34 55-76 20 43 47 68 81 75-30 9-49 33-58 73C63 57 37 33 0 25Z" fill="url(#signal)" stroke="none"/>
      <circle cx="142" cy="-24" r="24" fill="url(#signal)" stroke="none"/>
    </g>
    <text x="190" y="43" fill="#f6f7ef" font-family="Inter, ui-sans-serif, -apple-system, sans-serif" font-size="42" font-weight="650" letter-spacing="-1.4">TempoDance <tspan fill="#b8a9ff" font-style="italic">AI</tspan></text>
  </g>

  <g transform="translate(94 265)">
    <text fill="url(#type)" font-family="Inter, ui-sans-serif, -apple-system, sans-serif" font-size="118" font-weight="720" letter-spacing="-6">
      <tspan x="0" y="0">The coach that</tspan>
      <tspan x="0" y="120">learns how</tspan>
      <tspan x="0" y="240">you learn.</tspan>
    </text>
    <text x="5" y="335" fill="#9896a4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="560" letter-spacing="5">SELF-EVOLVING MOVEMENT INTELLIGENCE</text>
    <g transform="translate(5 385)">
      <rect width="182" height="50" rx="25" fill="#d6ff5f"/>
      <circle cx="27" cy="25" r="6" fill="#090a0b"/>
      <text x="45" y="33" fill="#090a0b" font-family="Inter, ui-sans-serif, sans-serif" font-size="18" font-weight="700">LOCAL POSE</text>
      <rect x="198" width="230" height="50" rx="25" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
      <text x="225" y="33" fill="#d6d5dd" font-family="Inter, ui-sans-serif, sans-serif" font-size="18" font-weight="620">VISIBLE MEMORY</text>
    </g>
  </g>

  <g transform="translate(1190 428)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g opacity=".13" transform="translate(-118 6) rotate(-12)" stroke="#8975ff" stroke-width="17">
      <circle cx="0" cy="-198" r="41"/>
      <path d="M-7-150-45-45-118 32M-45-45l-142-70M-11-144l91 73 111-71M-45-45 5 69l-83 151M5 69l127 136"/>
    </g>
    <g opacity=".27" transform="translate(-59 3) rotate(-6)" stroke="#71e9bf" stroke-width="17">
      <circle cx="0" cy="-198" r="41"/>
      <path d="M-7-150-45-45-118 32M-45-45l-142-70M-11-144l91 73 111-71M-45-45 5 69l-83 151M5 69l127 136"/>
    </g>
    <g stroke="url(#signal)" stroke-width="18" filter="url(#softGlow)">
      <circle cx="0" cy="-198" r="41" fill="#111118"/>
      <path d="M-7-150-45-45-118 32M-45-45l-142-70M-11-144l91 73 111-71M-45-45 5 69l-83 151M5 69l127 136"/>
      <g fill="#0b0c0e" stroke-width="10">
        <circle cx="-7" cy="-150" r="14"/><circle cx="-45" cy="-45" r="14"/><circle cx="-118" cy="32" r="14"/>
        <circle cx="-187" cy="-115" r="14"/><circle cx="80" cy="-71" r="14"/><circle cx="191" cy="-142" r="14"/>
        <circle cx="5" cy="69" r="14"/><circle cx="-78" cy="220" r="14"/><circle cx="132" cy="205" r="14"/>
      </g>
    </g>
    <g transform="translate(171 -75)">
      <rect width="210" height="78" rx="18" fill="#14141b" stroke="#fff" stroke-opacity=".12"/>
      <text x="22" y="30" fill="#8b8998" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2">POLICY 04</text>
      <text x="22" y="57" fill="#e9e9e3" font-family="Inter, sans-serif" font-size="20" font-weight="650">Wrist path ↑ 12%</text>
      <path d="M-12 43H0" stroke="#d6ff5f" stroke-width="3"/>
    </g>
  </g>

  <g transform="translate(94 838)">
    <line x1="0" y1="0" x2="1412" y2="0" stroke="#fff" stroke-opacity=".12"/>
    <text y="-23" fill="#74727f" font-family="ui-monospace, monospace" font-size="16" letter-spacing="2">OBSERVE  →  DIAGNOSE  →  INTERVENE  →  EVALUATE  →  EVOLVE</text>
    <text x="1412" y="-23" text-anchor="end" fill="#d6ff5f" font-family="ui-monospace, monospace" font-size="16" font-weight="700">TEMPO / 2026</text>
  </g>
</svg>
