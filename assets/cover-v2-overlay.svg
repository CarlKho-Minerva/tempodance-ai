      <stop offset="0.34" stop-color="#08080c" stop-opacity=".96"/>
      <stop offset="0.58" stop-color="#08080c" stop-opacity=".58"/>
      <stop offset="0.82" stop-color="#08080c" stop-opacity=".08"/>
